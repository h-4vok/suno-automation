name: Implement codex-ready issue

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open issue number carrying codex-ready
        required: true
        type: number

concurrency:
  group: codex-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  implement:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'codex-ready'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate and serialize trusted issue
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            const associations = new Set(["OWNER", "MEMBER", "COLLABORATOR"]);
            const labels = issue.labels.map((label) => typeof label === "string" ? label : label.name);
            if (issue.state !== "open" || !labels.includes("codex-ready")) {
              core.setFailed("Issue must be open and carry codex-ready.");
              return;
            }
            if (!associations.has(issue.author_association)) {
              core.setFailed(`Untrusted issue author association: ${issue.author_association}.`);
              return;
            }
            const fs = require("fs");
            fs.mkdirSync(".codex/runtime", { recursive: true });
            fs.writeFileSync(".codex/runtime/issue.json", JSON.stringify({
              number: issue.number,
              title: issue.title,
              body: issue.body,
              labels,
              html_url: issue.html_url,
            }, null, 2));
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              name: "codex-ready",
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ["codex-in-progress"],
            });
      - name: Create isolated branch
        run: git switch -c "codex/issue-${ISSUE_NUMBER}-${GITHUB_RUN_ID}"
      - name: Run Codex
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/implement-ready-issue.md
          sandbox: workspace-write
      - name: Remove transient issue material
        if: always()
        run: rm -rf .codex/runtime
      - run: pnpm check && pnpm build
      - name: Commit and push
        id: publish
        run: |
          git config user.name "codex-automation[bot]"
          git config user.email "codex-automation[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "feat: implement issue #${ISSUE_NUMBER}"
          git push --set-upstream origin HEAD
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Open draft pull request
        if: steps.publish.outputs.changed == 'true'
        run: |
          gh pr create \
            --draft \
            --title "Codex: issue #${ISSUE_NUMBER}" \
            --body "Automated implementation for #${ISSUE_NUMBER}. Human review and CI are required. Closes #${ISSUE_NUMBER}."
      - name: Report no changes
        if: steps.publish.outputs.changed != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: "Codex completed without a repository diff. Review the workflow output for blockers.",
            });
